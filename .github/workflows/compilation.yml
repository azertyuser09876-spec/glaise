# Compile Glaise.exe (Windows) et Glaise.apk (Android) à chaque envoi sur main.
# Un tag « v… » (par exemple v1.0) publie en plus les deux fichiers dans une Release.
name: Compilation

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Glaise.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Outils de compilation
        run: npm install --no-save --no-package-lock esbuild@0.24.0 postject@1.0.0-alpha.6 rcedit@4.0.1

      - name: Compilation de l'exécutable
        run: node build/sea.mjs

      - name: Vérification (application graphique, le serveur répond)
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist\Glaise.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          Write-Host "Sous-système PE : $sub (2 = graphique)"
          if ($sub -ne 2) { exit 1 }
          $env:OPEN = "0"
          $p = Start-Process -FilePath "dist\Glaise.exe" -ArgumentList "8099" -WorkingDirectory "dist" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          try {
            $r = Invoke-WebRequest -UseBasicParsing "http://localhost:8099/"
            $js = Invoke-WebRequest -UseBasicParsing "http://localhost:8099/js/client/main.js"
            Write-Host "index.html : $($r.StatusCode), main.js : $($js.StatusCode)"
            if ($r.StatusCode -ne 200 -or $js.StatusCode -ne 200) { exit 1 }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Remove-Item "dist\monde.json*" -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Glaise-windows
          path: dist/Glaise.exe
          if-no-files-found: error

  android:
    name: Glaise.apk (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilation de l'application
        run: gradle --no-daemon -p android assembleRelease

      - name: Renommage
        run: cp android/app/build/outputs/apk/release/app-release.apk Glaise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Glaise-android
          path: Glaise.apk
          if-no-files-found: error

  publication:
    name: Publication de la Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Glaise ${{ github.ref_name }}
          files: |
            Glaise.exe
            Glaise.apk
          body: |
            **Glaise.exe** (Windows) : le serveur. Double-cliquez : le jeu s'ouvre dans le navigateur et la fenêtre affiche les adresses à donner aux amis. Le monde est sauvegardé dans `monde.json`, à côté de l'exécutable.
            Windows peut afficher « Windows a protégé votre ordinateur » (exécutable non signé) : cliquez sur *Informations complémentaires* puis *Exécuter quand même*. Autorisez aussi l'accès réseau quand le pare-feu le demande.

            **Glaise.apk** (Android 8 ou plus) : l'application pour rejoindre un serveur. Autorisez l'installation depuis cette source, ouvrez l'application et entrez l'adresse affichée par le serveur (par exemple `http://192.168.1.20:8080`).

            Sur ordinateur, on peut aussi jouer sans rien installer : il suffit d'ouvrir l'adresse du serveur dans un navigateur.
